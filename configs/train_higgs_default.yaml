# Training configuration for Higgs ML dataset
# Matches the Settings dataclass fields in scripts/train_higgs.py

# Output directory name (used under results/)
output_dirname: "higgs-sequential-q68-10train-10valid-10ref-10calib-10test"

# Method for computing nonconformity scores: "diff" or "abs"
how: "abs"

# Whether to fit models in parallel using joblib
fit_parallel: false

# Data settings
data_dir: "data/HiggsML/input_data/train"
mu: 1.0

# Reproducibility
seed: 18

# Split sizes (number of parquet row groups)
train_size: 10
valid_size: 10
ref_size: 10
calib_size: 10
test_size: 10

# Classifier settings
threshold: 0.5

# Block size for pseudo-experiments (number of events per block)
block_size: 10000

# Nonconformity score target: "mu_hat" or "n_pred"
nonconf_target: "mu_hat"
